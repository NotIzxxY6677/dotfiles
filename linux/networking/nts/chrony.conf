# Purpose: Privacy-hardened, authenticated time synchronization (NTS only,
#          no leap smearing).
# Scope: Global chronyd configuration.
# Dependencies: Working DNS resolution (any resolver) for the NTS-KE
#               hostnames, and a roughly correct clock at boot. See the
#               driftfile directive below and the -s flag in chronyd's
#               startup options.
# Standard: RFC 8915 (NTS), RFC 5905 (NTPv4), RFC 8633 (NTP best current
#           practices).
#
# All time sources use NTS and none of them smear leap seconds. They are
# chosen for diversity of operator, network path, and stratum. As of 2026 no
# Asian national metrology institute or government time service offers NTS,
# so all of them are NTP only. Cloudflare anycast is the only production NTS
# source with points of presence in Asia. The remaining sources are European
# institutions reached over unicast.

# Cloudflare, global anycast, stratum 3.
# It has the widest anycast footprint of any NTS source, so it is the
# lowest-latency source here.
server time.cloudflare.com iburst nts

# TimeNL / SIDN Labs, unicast (Netherlands), stratum 1.
# Run by SIDN, the .nl registry. These two hosts are also members of the NTP
# Pool, but they are named, operator-run servers, not anonymous pool members,
# so they still meet the requirement for institutional NTS.
server ntppool1.time.nl iburst nts
server ntppool2.time.nl iburst nts

# PTB, the German national metrology institute, unicast (Germany), stratum 1.
server ptbtime1.ptb.de iburst nts

# Netnod, anycast but with all nodes in Sweden, stratum 1.
server nts.netnod.se iburst nts

# Never select unauthenticated sources. The packaged default
# sourcedir /run/chrony-dhcp is also left out on purpose, so servers offered
# by DHCP are never loaded, let alone selected.
authselectmode require

# Require at least two agreeing sources before disciplining the clock.
minsources 2

# Skip the certificate validity checks (activation and expiration times) for
# NTS-KE until the clock has been corrected once. This keeps the first key
# exchange from failing when the RTC is wrong. It applies only to chronyd's
# own TLS connections.
nocerttimecheck 1

# Keep NTS cookies and keys across restarts, which saves the NTS-KE round
# trips. Cookies are no substitute for DNS resolution of the source
# hostnames.
ntsdumpdir /var/lib/chrony

# Record the rate at which the system clock gains or loses time. The
# modification time of this file is also used by chronyd -s as the earliest
# system time after a cold boot.
driftfile /var/lib/chrony/drift

# Step the clock in the first three updates if its offset is larger than
# 1 second.
makestep 1.0 3

# Use the authoritative leap second table (the IERS and NIST schedule,
# shipped in tzdata). This directive was added in chrony 4.6, so this file
# needs chrony 4.6 or later. With the default leapsecmode system, a leap
# second is applied as a real kernel step, never slewed or smeared.
leapseclist /usr/share/zoneinfo/leap-seconds.list

# Copy the synchronized system time back to the RTC from time to time
# (the kernel 11-minute mode).
rtcsync

# Directory for the daemon's log files.
logdir /var/log/chrony
