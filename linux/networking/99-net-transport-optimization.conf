# Purpose: Transport tuning for latency under load on a measured link:
#          ~500 Mbit/s fibre WAN, 3.42 ms avg RTT, 0% loss -> BDP ~ 214 KB.
# Scope: Global kernel networking stack, host network namespace. Identical
#        on both hosts (desktop, laptop); nothing here is link-dependent.
#        Containers get their own network namespace: it inherits this
#        namespace's congestion-control default and tcp_rmem/tcp_wmem
#        (copied at namespace creation), while most other tcp_* keys reset
#        to kernel defaults inside. With this file that distinction is
#        moot, because buffers and congestion control are left at kernel
#        defaults anyway.
# Dependencies: None while the BBR block below stays commented
#               (CONFIG_TCP_CONG_BBR is a module in Fedora kernels,
#               auto-loaded if ever selected).
# Standard: ip-sysctl.rst, sysctl.d(5), tcp(7), udp(7), tc-fq_codel(8).
#
# net.ipv4.tcp_* keys govern TCP over IPv6 as well; there are no separate
# net.ipv6.tcp_* counterparts to keep in sync when IPv6 arrives.
#
# Buffer ceilings are deliberately absent. Kernel defaults on Fedora 44
# kernels (6.19 / 7.0 series) already dwarf this link's BDP:
#   net.core.rmem_max / wmem_max: 4 MiB          (raised in kernel 6.18)
#   net.ipv4.tcp_rmem max: RAM-scaled to 32 MiB  (raised in kernel 6.16)
#   net.ipv4.tcp_wmem max: 4 MiB
# That is 19-150x the ~214 KB BDP; raising ceilings buys nothing on this
# link, and larger send ceilings only license bigger bursts toward the ISP
# queue. Autotuning minimums and initial sizes are likewise left at kernel
# defaults (4 KiB min; 128 KiB / 16 KiB initial). UDP needs nothing either:
# Discord voice fits in the 208 KiB default socket buffer thousands of
# times over, and QUIC apps that request more via SO_RCVBUF are now granted
# up to the 4 MiB rmem_max default.

# Enable Packetization-Layer Path MTU Discovery when an ICMP black hole is
# detected (mode 1: inert on a clean path, so zero cost today). Insurance
# for the planned WARP/WireGuard tunnels, where reduced tunnel MTU plus
# filtered ICMP is the classic silent-stall failure. Covers IPv4 and IPv6.
# Fedora default: 0
net.ipv4.tcp_mtu_probing = 1

# Cap unsent bytes queued inside each TCP socket at 16 KiB. Bounds
# send-side latency when a socket is backlogged (multiplexed HTTP/2-3,
# concurrent uploads) at negligible throughput/wakeup cost on a 3.4 ms
# path. Honest expectation: Minecraft writes are far below 16 KiB and
# Discord voice is UDP, so this is principled insurance, not a
# perceptible win.
# Fedora default: 4294967295 (i.e., unlimited)
net.ipv4.tcp_notsent_lowat = 16384

# Congestion control and qdisc: intentionally left at Fedora defaults
# (cubic + fq_codel; systemd sets net.core.default_qdisc = fq_codel in
# /usr/lib/sysctl.d/50-default.conf). At 3.42 ms RTT with 0% measured
# loss, CUBIC fills the ~214 KB pipe within ~5 round trips (~20 ms) and,
# with no loss, never backs off; BBR's advantages (loss tolerance,
# long-RTT fairness, standing up to policers) do not exist on this path.
# fq_codel keeps per-flow isolation AND CoDel AQM if the NIC ever
# saturates; plain fq drops the AQM half. On Wi-Fi the root qdisc is
# bypassed entirely (mac80211 iTXQ + AQL), so default_qdisc is inert on
# the laptop's WLAN either way.
#
# BBR version reality check (verified 2026-07 against torvalds/linux
# master): mainline ships BBR v1 as the single "bbr" module; BBRv3 lives
# out of tree (github.com/google/bbr, branch v3) and Google's stated plan
# is to upgrade "bbr" IN PLACE when it merges -- the algorithm string will
# not change, so the string cannot tell versions apart. Inspect a running
# kernel with:
#   cat /proc/sys/net/ipv4/tcp_available_congestion_control
#   modinfo tcp_bbr   (the v1 module carries no version tag)
# Uncomment the pair below only to A/B test; expect no measurable change
# on this link. BBR paces via its internal timer under fq_codel.
#net.core.default_qdisc = fq
#net.ipv4.tcp_congestion_control = bbr

# Future VPN (WARP tunnel-only, later WireGuard) -- MTU/MSS notes:
# * MTU is a per-interface property, not a sysctl. Set it on the tunnel
#   device: wg-quick computes it automatically (or pin MTU = 1420 in the
#   [Interface] section / `nmcli connection modify <wg> wireguard.mtu
#   1420`); the WARP client manages its own device MTU. Nothing belongs in
#   this file for MTU.
# * MSS clamping is a router/firewall job (nftables 'tcp option maxseg'),
#   needed when forwarding for OTHER devices. An end host derives its MSS
#   from the interface MTU by itself -- again nothing to put here.
# * tcp_mtu_probing = 1 above is the host-side safety net, already active.
# * If WARP's MASQUE mode (userspace QUIC) ever carries bulk traffic and
#   `ss -uampi` shows receive-buffer drops, the UDP ceiling is the knob --
#   but the 4 MiB default already buffers ~67 ms at 500 Mbit/s, so raise
#   only on measured evidence:
#net.core.rmem_max = 8388608
#net.core.wmem_max = 8388608
