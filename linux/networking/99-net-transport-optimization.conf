# Transport tuning for general desktop use: BBR + fq low-latency TCP, raised UDP/QUIC ceilings.
# Initramfs carries a copy of this file -- run `sudo dracut --force` after every edit.

# BBR + fq pacing. Both are modules and absent from the initrd; the "-" prefix
# quiets the expected early-boot write failure (post-switch-root pass applies them).
-net.core.default_qdisc = fq
-net.ipv4.tcp_congestion_control = bbr

# Latency: keep cwnd across idle gaps; cap unsent socket-queue bytes at 128 KiB.
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 131072

# Path-MTU blackhole recovery, with a sane MSS floor for the probe search.
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_mtu_probe_floor = 1024

# Buffer ceilings only, nothing preallocated: UDP/QUIC socket caps plus the
# matching TCP send-autotune max. Min/default allocations unchanged.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216

# ---------------------------------------------------------------------------
# Inactive / reference only. Values match this machine's measured defaults
# (captured 2026-08) unless a comment says otherwise.
# ---------------------------------------------------------------------------

# Stock max is already 32 MiB on this host; the old 16 MiB line halved it.
#net.ipv4.tcp_rmem = 4096 131072 33554432

# No-op: already the default.
#net.ipv4.tcp_base_mss = 1024

# Client TFO (bit 1) already on; server bits pointless unless this host listens.
#net.ipv4.tcp_fastopen = 3

# Only bites once global udp_mem (~5.6 GiB) is exhausted; unreachable here.
#net.ipv4.udp_rmem_min = 131072

# Kernel default is 131072; Fedora's libkcapi drop-in pins 81920. Marginal.
#net.core.optmem_max = 131072

# Already the default (accept inbound ECN, never request outbound).
#net.ipv4.tcp_ecn = 2

# Obsolete since kernel 6.6 (per-socket scaling_ratio); write is ignored.
#net.ipv4.tcp_adv_win_scale = 1

# Documented no-op: UDP has no tx memory accounting.
#net.ipv4.udp_wmem_min = 4096

# Legacy options, no effect anymore.
#net.ipv4.tcp_fack = 0
#net.ipv4.tcp_low_latency = 0

# Already the defaults; adequate for a desktop.
#net.core.somaxconn = 4096
#net.core.netdev_max_backlog = 1000
